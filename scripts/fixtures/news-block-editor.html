<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lokale CMS-blokacceptatie</title><link rel="stylesheet" href="/src/admin/admin.css"><style>body{margin:0;background:#07121f;color:#edf5ff;font:16px system-ui}.admin-shell{display:block!important;padding:16px;max-width:1100px;margin:auto}.admin-card{min-width:0}button,input,textarea,select{font:inherit}button{cursor:pointer}</style><main class="admin-shell"><section class="admin-card"><h1>Conceptacceptatie</h1><div class="cms-editor"></div><button id="preview" type="button">Preview</button><div id="public-render"></div></section></main><script type="module">
import {mountBlockEditor} from '/src/admin/articleBlockEditor.js';import {newArticleBlock,renderArticleContent,bindArticleContent} from '/src/services/articleBlocks.js';import {preview} from '/src/admin/cmsUI.js';
const image={url:'https://fantasyvoetbaltalk.nl/club-logos/fc-utrecht.png',alt:'Clublogo FC Utrecht',caption:'Tijdelijke acceptatieafbeelding',width:160,height:160};
const blocks=['paragraph','paragraph','imageCarousel','paragraph','image','paragraph','paragraph','image','heading','quote','list'].map((type,n)=>({...newArticleBlock(type),...(['image','imageCarousel'].includes(type)?type==='image'?image:{images:Array.from({length:4},(_,i)=>({...image,caption:'Voorbeeld '+(i+1)}))}:{text:'Tijdelijke acceptatietekst '+(n+1)+' om blokken en responsive gedrag te controleren.',items:['Eerste punt','Tweede punt'],source:'FVT'} )}));
window.uploads=[];const client={storage:{from:()=>({upload:async(path,blob,options)=>{if(window.failUpload)return {error:{message:'Test: upload mislukt'}};uploads.push({path,size:blob.size,options});return {error:null}},getPublicUrl:()=>({data:{publicUrl:image.url}}),remove:async()=>({error:null})})}};
window.ed=await mountBlockEditor(document,{content_blocks:{version:1,blocks}},{client,userId:'00000000-0000-4000-8000-000000000001'});window.article=()=>({title:'Tijdelijk concept',intro:'Gerichte acceptatie van het nieuws-CMS.',content_blocks:ed.blocks()});document.querySelector('#preview').onclick=()=>preview(article());window.renderPublicTest=()=>{const root=document.querySelector('#public-render');root.innerHTML=renderArticleContent(article());bindArticleContent(root)};window.ready=true;
</script></html>

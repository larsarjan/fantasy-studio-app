<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lokale artikelstatistiekacceptatie</title>
<link rel="stylesheet" href="/src/admin/admin.css"><style>body{margin:0;background:#07121f;color:#edf5ff;font:16px system-ui}.admin-shell{display:block!important;padding:16px;max-width:1100px;margin:auto}.fvt-meta{display:flex;gap:12px;flex-wrap:wrap}.admin-card{min-width:0}button{font:inherit;padding:12px}.article-statistics{max-width:100%}</style>
<main class="admin-shell"><section class="admin-card"><h1>Artikelstatistiek</h1><article id="article"><div class="fvt-meta"><span>FVT-redactie</span><time>12 oktober 2026</time><span data-article-views hidden></span></div><p id="article-body">Deze artikelinhoud blijft leesbaar als de statistiekdienst niet beschikbaar is.</p></article><button id="preview" type="button">CMS-preview</button><section class="article-statistics"><h3>Statistieken</h3><div id="stats"></div></section><div class="admin-table-wrap"><table class="cms-table cms-articles-table"><thead><tr><th>Artikel</th><th>Categorie</th><th>Status</th><th>Auteur</th><th>Datums</th><th>Weergaven</th><th>Acties</th></tr></thead><tbody><tr><td data-label="Artikel">Testartikel</td><td data-label="Categorie">Nieuws</td><td data-label="Status">Gepubliceerd</td><td data-label="Auteur">Redactie</td><td data-label="Datums">12 oktober</td><td id="compact" class="cms-views-cell" data-label="Weergaven"></td><td data-label="Acties"><button>Bewerken</button></td></tr></tbody></table></div></section></main>
<script type="module">
import {mountArticleViews} from '/src/public/articleViews.js';import {articleStatsMarkup} from '/src/admin/articleStats.js';import {preview} from '/src/admin/cmsUI.js';
const article={id:'11111111-1111-4111-8111-111111111111',status:'published',published_at:'2026-01-01T00:00:00Z',title:'Lokale acceptatie',body:'Veilige lokale testinhoud voor de bestaande preview.'};
const account=new URLSearchParams(location.search).has('editor')?{permissions:['articles.read']}:{permissions:[]};
window.remount=()=>mountArticleViews(document.querySelector('#article'),article,account);window.refreshStats=async()=>{const stats=await(await fetch('/__stats')).json();document.querySelector('#stats').innerHTML=articleStatsMarkup(stats);document.querySelector('#compact').innerHTML=articleStatsMarkup(stats,true)};
document.querySelector('#preview').onclick=()=>preview(article);remount();await refreshStats();window.ready=true;
</script></html>
